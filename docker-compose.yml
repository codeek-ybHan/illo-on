# 로그 파일 무한 증가 방지 — 컨테이너당 최대 30MB(10MB x 3롤)로 캡.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    logging: *default-logging
    # 1GB RAM 인스턴스 대응 — MySQL 기본 메모리 사용량을 크게 줄인다.
    command:
      - --innodb-buffer-pool-size=64M
      - --innodb-flush-method=O_DIRECT
      - --performance-schema=OFF
      - --skip-log-bin
    environment:
      MYSQL_DATABASE: illo_on
      MYSQL_USER: illoon
      MYSQL_PASSWORD: ${DB_PASSWORD:-illoon}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - illoon-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 1GB RAM 대응 — JVM 힙을 컨테이너 메모리의 40%로 제한, 저메모리 친화적 GC.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=40.0 -XX:+UseSerialGC -Xss512k"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: illo_on
      DB_USER: illoon
      DB_PASSWORD: ${DB_PASSWORD:-illoon}
      JWT_SECRET: ${JWT_SECRET:-illo-on-compose-secret-change-me-0123456789-0123456789-0123456789}
      # 초대 링크에 박히는 접속 주소 — .env 의 APP_BASE_URL 을 서버 공개 주소로 설정
      INVITE_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}/invite/
      # 브라우저가 API 를 호출할 오리진. Caddy 를 거친 공개 주소 + 로컬 개발.
      APP_CORS_ALLOWED_ORIGINS: "${APP_BASE_URL:-http://localhost:5173},http://localhost:5173"
      # OpenAI 분석: .env 에 AI_PROVIDER=openai + OPENAI_API_KEY 를 넣으면 켜짐. 없으면 규칙 기반(mock).
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
    # prod 프로파일은 ddl-auto=validate 라 스키마가 미리 있어야 한다.
    # 데모 편의를 위해 첫 기동 시 자동 생성(update)으로 오버라이드한다.
    # 실제 운영에서는 이 줄을 지우고 DBML(docs/일로ON_ERD.md) 기준으로 스키마를 관리할 것.
    command: ["java", "-jar", "/app/app.jar", "--spring.jpa.hibernate.ddl-auto=update"]
    # front(nginx)가 내부 네트워크로 backend:8080 프록시. 외부 노출은 불필요.
    # Swagger 등 직접 접근이 필요하면 아래 주석 해제.
    # ports:
    #   - "8080:8080"
    expose:
      - "8080"

  front:
    build: ./front
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    # 공개 진입점은 caddy. front 는 루프백에만 노출해서 deploy.sh 헬스체크에만 쓴다.
    # (외부 트래픽은 caddy:443 → front:80 내부 프록시로 들어온다)
    ports:
      - "127.0.0.1:8088:80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - front
    # 공개 포트. 80 = ACME 챌린지 + HTTP→HTTPS 리다이렉트, 443 = HTTPS.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # 발급받은 TLS 인증서 — 재시작해도 재발급 안 하도록 영구 보관
      - caddy-config:/config

volumes:
  illoon-db-data:
  caddy-data:
  caddy-config:
