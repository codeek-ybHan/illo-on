spring:
  application:
    name: illo-on-backend
  profiles:
    active: dev

server:
  port: 8080

# JWT (운영에서는 환경변수로 주입)
jwt:
  secret: ${JWT_SECRET:illo-on-dev-secret-key-please-change-this-to-a-long-random-string-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

# CORS 허용 오리진 (프론트 dev 서버)
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  invite:
    base-url: ${INVITE_BASE_URL:http://localhost:5173/invite/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

---
# 개발: H2 파일 DB
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/illo-on;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

---
# 운영: MySQL
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:illo_on}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:illoon}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
