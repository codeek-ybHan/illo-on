spring:
  application:
    name: illo-on-backend
  profiles:
    active: dev
  # 로컬 시크릿(OpenAI 키 등) — backend/config/local.properties 에 넣으면 여기서 자동 로드.
  # 파일이 없어도 무시(optional). git 에는 커밋되지 않음.
  config:
    import: optional:file:config/local.properties
  # 업로드 녹음본 크기 상한 (기본 1MB → 실제 회의 녹음 허용)
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  # 외부 HTTP 클라이언트(OpenAI 등) 타임아웃 — 무한 대기 방지
  http:
    client:
      connect-timeout: 10s
      read-timeout: 120s

server:
  port: 8080

# JWT (운영에서는 환경변수로 주입)
jwt:
  secret: ${JWT_SECRET:illo-on-dev-secret-key-please-change-this-to-a-long-random-string-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

# CORS 허용 오리진 (프론트 dev 서버)
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  invite:
    base-url: ${INVITE_BASE_URL:http://localhost:5173/invite/}
  ai:
    # mock: OpenAI 호출 없이 규칙 기반 브리핑 (키 없이 데모 가능)
    # openai: Spring AI + OpenAI (OPENAI_API_KEY 필요)
    provider: ${AI_PROVIDER:mock}

# Spring AI — provider=openai 일 때만 실제 사용
spring.ai:
  openai:
    api-key: ${OPENAI_API_KEY:not-configured}
    chat:
      options:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
        temperature: 0.2
    audio:
      transcription:
        options:
          # whisper-1 이 기본. 더 빠른 gpt-4o-mini-transcribe 를 쓰려면
          #   OPENAI_STT_MODEL=gpt-4o-mini-transcribe
          model: ${OPENAI_STT_MODEL:whisper-1}
          language: ko
  # 재시도: 기본 10회/최대 3분 백오프는 장애 시 요청이 수 분간 매달림 → 축소
  retry:
    max-attempts: 2
    backoff:
      initial-interval: 1s
      max-interval: 10s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

---
# 개발: H2 파일 DB
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/illo-on;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

---
# 운영: MySQL
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:illo_on}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:illoon}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
